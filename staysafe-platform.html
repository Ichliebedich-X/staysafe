<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>安泊 StaySafe - 酒店安全决策平台</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #4A6FA5;
      --color-primary-light: #6B8CBF;
      --color-primary-dark: #3A5A8A;
      --color-warning: #E8A87C;
      --color-warning-light: #F0C6A8;
      --color-ai: #8D7B68;
      --color-ai-light: #A89580;
      --color-success: #5B9A6F;
      --color-success-light: #7BBF8F;
      --color-danger: #C96868;
      --color-danger-light: #D98888;
      --color-bg-primary: #F5F7FA;
      --color-bg-secondary: #FFFFFF;
      --color-bg-tertiary: #EDF1F7;
      --color-text-primary: #2C3E50;
      --color-text-secondary: #5D6D7E;
      --color-text-muted: #95A5A6;
      --color-border: #E0E5EA;
      --color-credibility-l1: #95A5A6;
      --color-credibility-l2: #4A6FA5;
      --color-credibility-l3: #5B9A6F;
      --color-credibility-l4: #D4A574;
      --font-family: 'Inter', system-ui, sans-serif;
      --font-size-xs: 12px;
      --font-size-sm: 14px;
      --font-size-base: 16px;
      --font-size-lg: 18px;
      --font-size-xl: 24px;
      --font-size-2xl: 32px;
      --font-weight-light: 300;
      --font-weight-normal: 400;
      --font-weight-medium: 500;
      --font-weight-semibold: 600;
      --font-weight-bold: 700;
      --spacing-xs: 4px;
      --spacing-sm: 8px;
      --spacing-md: 16px;
      --spacing-lg: 24px;
      --spacing-xl: 32px;
      --spacing-2xl: 48px;
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-xl: 16px;
      --shadow-sm: 0 1px 3px rgba(44, 62, 80, 0.06);
      --shadow-md: 0 2px 8px rgba(44, 62, 80, 0.08);
      --shadow-lg: 0 8px 24px rgba(44, 62, 80, 0.12);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-family);
      font-size: var(--font-size-base);
      font-weight: var(--font-weight-normal);
      color: var(--color-text-primary);
      background-color: var(--color-bg-primary);
      line-height: 1.6;
      min-height: 100vh;
    }

    #app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ===== Navbar ===== */
    .navbar {
      background: var(--color-bg-secondary);
      box-shadow: var(--shadow-sm);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--color-border);
    }

    .navbar-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 var(--spacing-lg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
      font-size: var(--font-size-lg);
      font-weight: var(--font-weight-bold);
      color: var(--color-primary);
      text-decoration: none;
    }

    .logo svg {
      width: 24px;
      height: 24px;
    }

    .navbar-nav {
      display: flex;
      gap: var(--spacing-xs);
      align-items: center;
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: var(--spacing-xs);
      padding: var(--spacing-sm) var(--spacing-md);
      border-radius: var(--radius-md);
      text-decoration: none;
      color: var(--color-text-secondary);
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-medium);
      transition: all 0.2s ease;
    }

    .nav-link svg {
      width: 18px;
      height: 18px;
    }

    .nav-link:hover {
      background: var(--color-bg-tertiary);
      color: var(--color-primary);
    }

    .nav-link.active {
      background: rgba(74, 111, 165, 0.1);
      color: var(--color-primary);
    }

    @media (max-width: 768px) {
      .navbar-nav {
        flex-wrap: wrap;
      }

      .nav-link span {
        display: none;
      }
    }

    /* ===== Layout ===== */
    .main-content {
      flex: 1;
      padding: var(--spacing-xl) var(--spacing-lg);
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    .page-header {
      margin-bottom: var(--spacing-xl);
    }

    .page-title {
      font-size: var(--font-size-2xl);
      font-weight: var(--font-weight-bold);
      color: var(--color-text-primary);
      margin-bottom: var(--spacing-sm);
    }

    .page-subtitle {
      font-size: var(--font-size-base);
      color: var(--color-text-secondary);
    }

    /* ===== Cards ===== */
    .card {
      background: var(--color-bg-secondary);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      padding: var(--spacing-lg);
      margin-bottom: var(--spacing-lg);
      transition: all 0.3s ease;
      border: 1px solid var(--color-border);
    }

    .card-interactive {
      cursor: pointer;
    }

    .card-interactive:hover {
      box-shadow: var(--shadow-lg);
      transform: translateY(-2px);
      border-color: var(--color-primary-light);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--spacing-md);
    }

    .card-title {
      font-size: var(--font-size-lg);
      font-weight: var(--font-weight-semibold);
      color: var(--color-text-primary);
    }

    .card-body {
      font-size: var(--font-size-sm);
      color: var(--color-text-secondary);
    }

    /* ===== Buttons ===== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: var(--spacing-sm) var(--spacing-lg);
      border-radius: var(--radius-md);
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-medium);
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
      outline: none;
      text-decoration: none;
      gap: var(--spacing-sm);
      font-family: inherit;
    }

    .btn svg {
      width: 16px;
      height: 16px;
    }

    .btn-primary {
      background: var(--color-primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--color-primary-dark);
      box-shadow: 0 4px 12px rgba(74, 111, 165, 0.3);
    }

    .btn-outline {
      background: transparent;
      color: var(--color-primary);
      border: 1px solid var(--color-border);
    }

    .btn-outline:hover {
      border-color: var(--color-primary);
      background: rgba(74, 111, 165, 0.05);
    }

    .btn-warning {
      background: var(--color-warning);
      color: white;
    }

    .btn-warning:hover {
      background: #D4986C;
    }

    .btn-success {
      background: var(--color-success);
      color: white;
    }

    .btn-success:hover {
      background: #4A8A5F;
    }

    .btn-sm {
      padding: var(--spacing-xs) var(--spacing-md);
      font-size: var(--font-size-xs);
    }

    .btn-lg {
      padding: var(--spacing-md) var(--spacing-xl);
      font-size: var(--font-size-base);
    }

    .btn-block {
      width: 100%;
    }

    /* ===== Inputs ===== */
    .input,
    .select,
    .textarea {
      padding: var(--spacing-sm) var(--spacing-md);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      font-size: var(--font-size-sm);
      color: var(--color-text-primary);
      background: var(--color-bg-secondary);
      transition: all 0.2s ease;
      outline: none;
      width: 100%;
      font-family: inherit;
    }

    .input:focus,
    .select:focus,
    .textarea:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(74, 111, 165, 0.1);
    }

    .select-placeholder {
      color: var(--color-text-muted);
    }

    .select-placeholder option:not(:disabled) {
      color: var(--color-text-primary);
    }

    .textarea {
      resize: vertical;
      min-height: 80px;
    }

    .form-group {
      margin-bottom: var(--spacing-md);
    }

    .form-label {
      display: block;
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-medium);
      color: var(--color-text-secondary);
      margin-bottom: var(--spacing-xs);
    }

    .search-bar {
      display: flex;
      gap: var(--spacing-sm);
      flex-wrap: wrap;
    }

    .search-bar .input {
      flex: 1;
      min-width: 200px;
    }

    /* ===== Progress Bar ===== */
    .progress-bar {
      height: 8px;
      background: var(--color-bg-tertiary);
      border-radius: 4px;
      overflow: hidden;
      margin: var(--spacing-sm) 0;
    }

    .progress-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.6s ease;
    }

    .progress-fill.low {
      background: var(--color-danger);
    }

    .progress-fill.medium {
      background: var(--color-warning);
    }

    .progress-fill.high {
      background: var(--color-success);
    }

    .score-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--spacing-xs);
    }

    .score-label {
      font-size: var(--font-size-sm);
      color: var(--color-text-secondary);
    }

    .score-value {
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-semibold);
      color: var(--color-text-primary);
    }

    /* ===== Tags ===== */
    .tag {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: var(--font-size-xs);
      font-weight: var(--font-weight-medium);
      margin-right: var(--spacing-sm);
      margin-bottom: var(--spacing-sm);
    }

    .tag-primary {
      background: rgba(74, 111, 165, 0.1);
      color: var(--color-primary);
    }

    .tag-warning {
      background: rgba(232, 168, 124, 0.15);
      color: #C4885C;
    }

    .tag-ai {
      background: rgba(141, 123, 104, 0.1);
      color: var(--color-ai);
    }

    .tag-success {
      background: rgba(91, 154, 111, 0.1);
      color: var(--color-success);
    }

    .tag-danger {
      background: rgba(201, 104, 104, 0.1);
      color: var(--color-danger);
    }

    /* ===== Credibility Badges ===== */
    .credibility-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: var(--font-size-xs);
      font-weight: var(--font-weight-semibold);
    }

    .credibility-l1 {
      background: rgba(149, 165, 166, 0.15);
      color: var(--color-credibility-l1);
      border: 1px solid rgba(149, 165, 166, 0.3);
    }

    .credibility-l2 {
      background: rgba(74, 111, 165, 0.15);
      color: var(--color-credibility-l2);
      border: 1px solid rgba(74, 111, 165, 0.3);
    }

    .credibility-l3 {
      background: rgba(91, 154, 111, 0.15);
      color: var(--color-credibility-l3);
      border: 1px solid rgba(91, 154, 111, 0.3);
    }

    .credibility-l4 {
      background: rgba(212, 165, 116, 0.15);
      color: #B8945E;
      border: 1px solid rgba(212, 165, 116, 0.3);
    }

    /* ===== Timeline ===== */
    .timeline-item {
      position: relative;
      padding-left: var(--spacing-xl);
      padding-bottom: var(--spacing-lg);
      border-left: 2px solid var(--color-border);
      margin-left: var(--spacing-sm);
    }

    .timeline-item:last-child {
      padding-bottom: 0;
      border-left-color: transparent;
    }

    .timeline-dot {
      position: absolute;
      left: -5px;
      top: 0;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--color-primary);
    }

    .timeline-dot.l1 {
      background: var(--color-credibility-l1);
    }

    .timeline-dot.l2 {
      background: var(--color-credibility-l2);
    }

    .timeline-dot.l3 {
      background: var(--color-credibility-l3);
    }

    .timeline-dot.l4 {
      background: var(--color-credibility-l4);
    }

    .timeline-date {
      font-size: var(--font-size-xs);
      color: var(--color-text-muted);
      margin-bottom: var(--spacing-xs);
    }

    .timeline-title {
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-medium);
      color: var(--color-text-primary);
      margin-bottom: var(--spacing-xs);
    }

    .timeline-desc {
      font-size: var(--font-size-sm);
      color: var(--color-text-secondary);
    }

    /* ===== Checklist ===== */
    .checklist-item {
      display: flex;
      align-items: flex-start;
      gap: var(--spacing-md);
      padding: var(--spacing-md);
      border-radius: var(--radius-md);
      background: var(--color-bg-primary);
      margin-bottom: var(--spacing-sm);
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .checklist-item:hover {
      background: var(--color-bg-tertiary);
    }

    .checklist-item.completed {
      background: rgba(91, 154, 111, 0.08);
    }

    .checklist-item.completed .checklist-text {
      text-decoration: line-through;
      color: var(--color-text-muted);
    }

    .checklist-checkbox {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 2px solid var(--color-border);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      color: white;
    }

    .checklist-item.completed .checklist-checkbox {
      background: var(--color-success);
      border-color: var(--color-success);
    }

    .checklist-checkbox svg {
      width: 14px;
      height: 14px;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .checklist-item.completed .checklist-checkbox svg {
      opacity: 1;
    }

    .checklist-text {
      flex: 1;
      font-size: var(--font-size-sm);
      color: var(--color-text-secondary);
    }

    .checklist-text strong {
      display: block;
      color: var(--color-text-primary);
      margin-bottom: 2px;
    }

    /* ===== Step Cards ===== */
    .step-card {
      background: var(--color-bg-secondary);
      border-radius: var(--radius-lg);
      padding: var(--spacing-lg);
      margin-bottom: var(--spacing-md);
      border-left: 4px solid var(--color-primary);
      border-top: 1px solid var(--color-border);
      border-right: 1px solid var(--color-border);
      border-bottom: 1px solid var(--color-border);
    }

    .step-number {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(74, 111, 165, 0.1);
      color: var(--color-primary);
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-semibold);
      margin-bottom: var(--spacing-sm);
    }

    .step-title {
      font-size: var(--font-size-lg);
      font-weight: var(--font-weight-semibold);
      margin-bottom: var(--spacing-sm);
    }

    .step-desc {
      font-size: var(--font-size-sm);
      color: var(--color-text-secondary);
      line-height: 1.8;
    }

    .step-desc ul {
      margin-left: var(--spacing-lg);
      margin-top: var(--spacing-sm);
    }

    .step-desc li {
      margin-bottom: var(--spacing-xs);
    }

    /* ===== Modal ===== */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }

    .modal-overlay.show {
      opacity: 1;
      visibility: visible;
    }

    .modal-content {
      background: var(--color-bg-secondary);
      border-radius: var(--radius-xl);
      padding: var(--spacing-xl);
      max-width: 560px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      transform: scale(0.9);
      transition: transform 0.3s ease;
    }

    .modal-overlay.show .modal-content {
      transform: scale(1);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--spacing-lg);
      padding-bottom: var(--spacing-md);
      border-bottom: 1px solid var(--color-border);
    }

    .modal-title {
      font-size: var(--font-size-xl);
      font-weight: var(--font-weight-semibold);
    }

    .modal-close {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: var(--color-bg-primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      color: var(--color-text-muted);
    }

    .modal-close:hover {
      background: rgba(201, 104, 104, 0.1);
      color: var(--color-danger);
    }

    /* ===== Hotel Card ===== */
    .hotel-card {
      display: flex;
      gap: var(--spacing-md);
      align-items: flex-start;
    }

    .hotel-card-img {
      width: 120px;
      height: 100px;
      border-radius: var(--radius-md);
      object-fit: cover;
      flex-shrink: 0;
      background: var(--color-bg-tertiary);
    }

    .hotel-card-content {
      flex: 1;
    }

    .hotel-card-name {
      font-size: var(--font-size-lg);
      font-weight: var(--font-weight-semibold);
      margin-bottom: var(--spacing-xs);
    }

    .hotel-card-info {
      font-size: var(--font-size-sm);
      color: var(--color-text-secondary);
      margin-bottom: var(--spacing-sm);
      display: flex;
      gap: var(--spacing-md);
      flex-wrap: wrap;
    }

    .hotel-card-info span {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* ===== Risk Dimension ===== */
    .risk-dimension {
      padding: var(--spacing-md);
      border-radius: var(--radius-md);
      background: var(--color-bg-primary);
      margin-bottom: var(--spacing-sm);
    }

    .risk-dimension-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--spacing-xs);
    }

    .risk-dimension-name {
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-medium);
      color: var(--color-text-primary);
    }

    .risk-dimension-score {
      font-size: var(--font-size-lg);
      font-weight: var(--font-weight-bold);
    }

    .risk-dimension-desc {
      font-size: var(--font-size-xs);
      color: var(--color-text-muted);
      margin-top: var(--spacing-xs);
    }

    /* ===== Data Source ===== */
    .data-source {
      font-size: var(--font-size-xs);
      color: var(--color-text-muted);
      margin-top: var(--spacing-md);
      padding-top: var(--spacing-md);
      border-top: 1px dashed var(--color-border);
    }

    .data-source-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-right: var(--spacing-md);
    }

    /* ===== AI Banner ===== */
    .ai-banner {
      background: linear-gradient(135deg, rgba(141, 123, 104, 0.08), rgba(141, 123, 104, 0.03));
      border: 1px solid rgba(141, 123, 104, 0.2);
      border-radius: var(--radius-lg);
      padding: var(--spacing-lg);
      margin-bottom: var(--spacing-lg);
      display: flex;
      gap: var(--spacing-md);
      align-items: flex-start;
    }

    .ai-banner-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(141, 123, 104, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--color-ai);
    }

    .ai-banner-content {
      flex: 1;
    }

    .ai-banner-title {
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-semibold);
      color: var(--color-ai);
      margin-bottom: var(--spacing-xs);
    }

    .ai-banner-text {
      font-size: var(--font-size-sm);
      color: var(--color-text-secondary);
      line-height: 1.7;
    }

    /* ===== Disclaimer ===== */
    .disclaimer {
      text-align: center;
      padding: var(--spacing-lg);
      font-size: var(--font-size-xs);
      color: var(--color-text-muted);
      border-top: 1px solid var(--color-border);
      background: var(--color-bg-secondary);
    }

    /* ===== Footer ===== */
    .footer {
      background: var(--color-bg-secondary);
      border-top: 1px solid var(--color-border);
      padding: var(--spacing-xl) var(--spacing-lg);
      text-align: center;
    }

    .footer-text {
      font-size: var(--font-size-xs);
      color: var(--color-text-muted);
    }

    .footer-disclaimer {
      font-size: var(--font-size-sm);
      color: var(--color-text-secondary);
      margin-top: var(--spacing-sm);
      font-weight: var(--font-weight-medium);
    }

    /* ===== Toast ===== */
    .toast {
      position: fixed;
      top: 80px;
      right: var(--spacing-lg);

    function analyzeSafetyFromComments(comments) {
      let score = 80;
      const tags = [];

      if (!comments || comments.length === 0) {
        return { score: 75, tags: ['数据不足'] };
      }

      const negativeKeywords = ['偷拍', '摄像头', '针孔', '隐私', '门锁', '安全', '尾随', '骚扰', '报警', '小偷', '丢失', '损坏'];
      const positiveKeywords = ['安全', '放心', '安心', '舒适', '干净', '服务好', '满意'];

      let negativeCount = 0;
      let positiveCount = 0;

      comments.forEach(c => {
        const text = (c.text || c.content || '').toLowerCase();
        negativeKeywords.forEach(kw => {
          if (text.includes(kw)) negativeCount++;
        });
        positiveKeywords.forEach(kw => {
          if (text.includes(kw)) positiveCount++;
        });
      });

      score = Math.max(50, Math.min(95, 80 + (positiveCount * 3) - (negativeCount * 5)));

      if (negativeCount >= 3) {
        tags.push('不推荐独行女性');
      }
      if (negativeCount >= 2) {
        tags.push('隐私需关注');
      }
      if (negativeCount >= 1) {
        tags.push('设备老旧');
      }
      if (positiveCount >= 5) {
        tags.push('推荐入住');
      }
      if (positiveCount >= 3 && negativeCount === 0) {
        tags.push('行业标杆');
      }

      if (tags.length === 0) {
        tags.push('综合较好');
      }

      return { score, tags };
    }

            ]
          },
          {
            category: '环境安全',
            icon: 'M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z',
            items: [
              { id: 9, title: '窗户窗帘检查', desc: '检查窗户锁扣是否完好，窗帘能否完全遮光，检查窗帘轨道、窗台等安全死角', completed: false },
              { id: 10, title: '消防设施检查', desc: '确认房间内消防器材位置（灭火器、防毒面具），检查火警报警器是否正常', completed: false },

            ]
          }
        ]);

        const checklist = computed(() => {
          return checklistGroups.flatMap(group => group.items);
        });

        const completedCount = computed(() => checklist.value.filter(i => i.completed).length);
        const progress = computed(() => Math.round(completedCount.value / checklist.value.length * 100));

        function toggleItem(id) {
          const item = checklist.value.find(i => i.id === id);
          if (item) {
            item.completed = !item.completed;
            if (item.completed) showToast('已完成：' + item.title);
          }
        }

        const emergencyContacts = [
          { name: '报警电话', number: '110', desc: '遇到安全威胁时立即拨打' },
          { name: '急救电话', number: '120', desc: '医疗紧急情况' },
          { name: '消防电话', number: '119', desc: '火灾或被困情况' },
          { name: '消费者投诉', number: '12315', desc: '酒店消费纠纷投诉' }
        ];

        const showReportForm = ref(false);
        const formData = reactive({
          hotel: '',
          type: '',
          description: '',
          date: new Date().toISOString().substring(0, 10),
          time: new Date().toTimeString().substring(0, 5),
          files: [],
          hasPoliceReport: false,
          isAnonymous: true
        });

        const incidentTypes = ['偷拍疑似', '门锁异常', '工作人员擅入', '消防安全', '尾随骚扰', '其他安全事件'];

        function openReportForm() {
          showReportForm.value = true;
          formData.date = new Date().toISOString().substring(0, 10);
          formData.time = new Date().toTimeString().substring(0, 5);
        }

        function closeReportForm() {
          showReportForm.value = false;
        }

        function handleFileUpload(event) {
          const files = Array.from(event.target.files);
          files.forEach(file => {
            const reader = new FileReader();
            reader.onload = (e) => {
              formData.files.push({
                name: file.name,
                type: file.type,
                preview: e.target.result,
                size: file.size
              });
            };
            reader.readAsDataURL(file);
          });
        }

        function removeFile(index) {
          formData.files.splice(index, 1);
        }

        function submitReport() {
          if (!formData.hotel || !formData.type) {
            showToast('请填写酒店名称和事件类型');
            return;
          }
          const incidents = JSON.parse(localStorage.getItem('staySafe_incidents') || '[]');
          const newIncident = {
            id: Date.now(),
            hotel: formData.hotel,
            type: formData.type,
            date: formData.date + ' ' + formData.time,
            status: '审核中',
            credibility: formData.hasPoliceReport ? 'L4' : (formData.files.length > 0 ? 'L3' : 'L2'),
            desc: formData.description || '暂无详细描述',
            fileCount: formData.files.length
          };
          incidents.unshift(newIncident);
          localStorage.setItem('staySafe_incidents', JSON.stringify(incidents));

          updateHotelScore(formData.hotel, formData.type, newIncident.credibility);

          showToast('事件已提交，AI正在自动分类中，酒店评分已更新');
          closeReportForm();
          formData.hotel = '';
          formData.type = '';
          formData.description = '';
          formData.files = [];
          formData.hasPoliceReport = false;
        }

        function updateHotelScore(hotelName, incidentType, credibility) {
          let hotels = JSON.parse(localStorage.getItem('staySafe_hotels') || '[]');
          let needSave = false;

          const scoreImpact = {
            'L4': -15,
            'L3': -10,
            'L2': -5,
            'L1': -2
          };

          const typeToDimension = {
            '偷拍疑似': '隐私保护',
            '门锁异常': '门锁安全',
            '工作人员擅入': '人员管理',
            '消防安全': '环境安全',
            '尾随骚扰': '人员管理',
            '其他安全事件': '环境安全'
          };

          hotels.forEach(hotel => {
            if (hotel.name.includes(hotelName) || hotelName.includes(hotel.name)) {
              const impact = scoreImpact[credibility] || -5;
              const dimension = typeToDimension[incidentType] || '环境安全';

              if (hotel.riskDimensions) {
                hotel.riskDimensions.forEach(dim => {
                  if (dim.name === dimension) {
                    dim.score = Math.max(0, dim.score + impact);
                    dim.trend = 'down';
                  }
                });
              }

              hotel.safetyScore = Math.max(0, hotel.safetyScore + impact);

              if (hotel.safetyScore < 60) {
                if (!hotel.riskTags.includes('不推荐独行女性')) {
                  hotel.riskTags.push('不推荐独行女性');
                }
              }
              if (hotel.safetyScore < 70 && !hotel.riskTags.includes('隐私需关注')) {
                hotel.riskTags.push('隐私需关注');
              }
              if (hotel.safetyScore < 75 && !hotel.riskTags.includes('设备老旧')) {
                hotel.riskTags.push('设备老旧');
              }

              hotel.riskTags = [...new Set(hotel.riskTags)];

              const positiveTags = ['推荐入住', '行业标杆', '门禁可靠', '适合常住', '综合较好', '性价比高'];
              if (hotel.safetyScore < 75) {
                hotel.riskTags = hotel.riskTags.filter(tag => !positiveTags.includes(tag));
              }

              needSave = true;
            }
          });

          if (needSave) {
            localStorage.setItem('staySafe_hotels', JSON.stringify(hotels));
          }
        }

        return { checklist, checklistGroups, completedCount, progress, toggleItem, emergencyContacts, showReportForm, formData, incidentTypes, openReportForm, closeReportForm, handleFileUpload, removeFile, submitReport, credibilityInfo };
